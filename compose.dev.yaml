services:
  frontend:
    container_name: frontend
    build:
      context: ./frontend
    ports:
      - "5173:5173"
    volumes:
      - ./frontend/.:/app
      - /app/node_modules

  backend:
    build: ./backend
    container_name: backend
    expose:
      - "8000"
    volumes:
      - sqlite_data:/data
    environment:
      DATABASE_PATH: /data/db.sqlite3

  ml-service:
    build: ./models
    container_name: wildlife-api
    ports:
      - "8001:8001"
    volumes:
      - ./models/convnext_small-0c510722.pth:/root/.cache/torch/hub/checkpoints/convnext_small-0c510722.pth
    shm_size: "2gb"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

volumes:
  sqlite_data:
