services:
  frontend:
    container_name: frontend
    build:
      context: ./frontend
    ports:
      - "5173:5173"
    volumes:
      - ./frontend/.:/app
      - /app/node_modules

  backend:
    build: ./backend
    container_name: backend
    expose:
      - "8000"
    volumes:
      - sqlite_data:/data
    environment:
      DATABASE_PATH: /data/db.sqlite3

volumes:
  sqlite_data:
