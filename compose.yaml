services:
  nginx:
    build:
      context: .
      dockerfile: nginx/Dockerfile
    container_name: nginx
    ports:
      - "5173:80"
    restart: unless-stopped
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - backend
    networks:
      - frontend
      - backend-network

  backend:
    build: ./backend
    container_name: backend
    expose:
      - "8000"
    networks:
      - backend-network
    volumes:
      - sqlite_data:/data
    environment:
      DATABASE_PATH: /data/db.sqlite3

volumes:
  sqlite_data:

networks:
  frontend:
    driver: bridge

  backend-network:
    driver: bridge
    internal: true
